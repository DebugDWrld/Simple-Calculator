<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>简单计算器</h1>
    <input type="number" id="num1" placeholder="操作数1">
    <select id="operator">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
    </select>
    <input type="number" id="num2" placeholder="操作数2">

    <button onclick="calculate()">=</button>
    <h2 id="result"></h2>

    <div>
        <button onclick="getHistory('first')">第一条</button>
        <button onclick="getHistory('prev')">上一条</button>
        <button onclick="getHistory('current')">当前条</button>
        <button onclick="getHistory('next')">下一条</button>
        <button onclick="getHistory('last')">最后一条</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
